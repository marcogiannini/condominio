name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Versione portatile (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Gestione_Condominio_Portatile | Out-Null
          Copy-Item target/release/condominio.exe dist/Gestione_Condominio_Portatile/
          "Modalita portatile: i dati sono salvati nella cartella 'dati' accanto a questo programma." | Out-File dist/Gestione_Condominio_Portatile/portable.txt -Encoding utf8
          Compress-Archive -Path dist/Gestione_Condominio_Portatile -DestinationPath dist/Gestione_Condominio_Portatile.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: condominio-windows
          path: |
            dist/Gestione_Condominio_Setup.exe
            dist/Gestione_Condominio_Portatile.zip

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: condominio-linux-appimage
          path: Gestione_Condominio-x86_64.AppImage
