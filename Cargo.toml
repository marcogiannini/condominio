[package]
name = "condominio"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.29"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
opener = "0.9.0"
quick-xml = "0.42.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
